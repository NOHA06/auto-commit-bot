
name: Daily Auto Commit

on:
  schedule:
    - cron: '40 07* * *' # Tous les jours à 06:17 UTC (heure creuse, moins de retards)
  workflow_dispatch:     # Lancement manuel depuis l'onglet Actions

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Exécuter le script
        run: node bot.js

      - name: Configurer l'identité Git (liée au compte NOHA06)
        run: |
          git config --global user.name "NOHA06"
          git config --global user.email "${{ github.repository_owner_id }}+NOHA06@users.noreply.github.com"

      - name: Faire le commit et le push
        run: |
          git add README.md
          git diff --staged --quiet || (git commit -m "docs: mise à jour automatique de la notion tech du jour 📚" && git push)
