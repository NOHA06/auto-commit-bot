name: Daily Auto Commit

on:
  schedule:
    - cron: '51 9 * * *' # S'exécute tous les jours à 08:45 UTC
  workflow_dispatch:     # Permet aussi un lancement manuel depuis l'onglet Actions

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Indispensable pour donner les droits d'écriture au token GitHub

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Exécuter le script
        run: node bot.js

      - name: Configurer l'identité Git du bot
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Faire le commit et le push
        run: |
          git add README.md
          # Vérifie s'il y a des changements avant de commiter et pousser pour éviter les erreurs de pipeline
          git diff --staged --quiet || (git commit -m "docs: mise à jour automatique de la notion tech du jour 📚" && git push)
